<header class="header">
    <div class="container">
        <nav class="navbar">
            <!-- Logo -->
            <div class="logo">
                <a routerLink="/">
                    <span class="logo-text">Donate App</span>
                </a>
            </div>

            <!-- Desktop Navigation -->
            <ul class="nav-menu" [class.active]="isMenuOpen">
                <li><a routerLink="/home" routerLinkActive="active-link" (click)="closeMenu()">হোম</a></li>
                <li><a routerLink="/about" routerLinkActive="active-link" (click)="closeMenu()">আমাদের সম্পর্কে</a></li>
                <li><a routerLink="/get-involved" routerLinkActive="active-link" (click)="closeMenu()">আমাদের সাথে যুক্ত
                        হোন</a></li>
                <li><a routerLink="/projects" routerLinkActive="active-link" (click)="closeMenu()">প্রকল্পসমূহ</a></li>
                <li><a routerLink="/donate" routerLinkActive="active-link" (click)="closeMenu()">দান করুন</a></li>
                <li><a routerLink="/gallery" routerLinkActive="active-link" (click)="closeMenu()">গ্যালারি</a></li>
                <li><a routerLink="/blog" routerLinkActive="active-link" (click)="closeMenu()">ব্লগ</a></li>
                <li><a routerLink="/contact" routerLinkActive="active-link" (click)="closeMenu()">যোগাযোগ</a></li>
            </ul>

            <!-- CTA Button & Actions -->
            <div class="nav-actions">
                <div class="lang-toggle">
                    <button class="active">বাং</button>
                    <button>EN</button>
                </div>
                <a routerLink="/auth/signin" class="user-btn">
                    <i class="fas fa-user"></i>
                </a>

                <div class="nav-cta">
                    <a routerLink="/donate" class="btn btn-primary">দান করুন</a>
                </div>
            </div>

            <!-- Mobile Menu Toggle -->
            <button class="menu-toggle" (click)="toggleMenu()" [class.active]="isMenuOpen">
                <span></span>
                <span></span>
                <span></span>
            </button>
        </nav>
    </div>
</header>
