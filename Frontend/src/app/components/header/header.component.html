<header class="header">
    <div class="container">
        <nav class="navbar">
            <!-- Logo -->
            <div class="logo">
                <a routerLink="/">
                    <span class="logo-text">আস-সুন্নাহ ফাউন্ডেশন</span>
                </a>
            </div>

            <!-- Desktop Navigation -->
            <ul class="nav-menu" [class.active]="isMenuOpen">
                <li><a routerLink="/home" (click)="closeMenu()">হোম</a></li>
                <li><a routerLink="/about" (click)="closeMenu()">আমাদের সম্পর্কে</a></li>

                <li><a routerLink="/blog" (click)="closeMenu()">ব্লগ</a></li>
                <li><a routerLink="/contact" (click)="closeMenu()">যোগাযোগ</a></li>
            </ul>

            <!-- CTA Button -->
            <div class="nav-cta">
                <a href="#donate" class="btn btn-primary">দান করুন</a>
            </div>

            <!-- Mobile Menu Toggle -->
            <button class="menu-toggle" (click)="toggleMenu()" [class.active]="isMenuOpen">

                <span></span>
            </button>
        </nav>
