<section class="relative overflow-hidden py-6 bg-gradient-to-br from-primary-green-dark to-primary-green">
    <!-- Background Overlay -->
    <div
        class="absolute inset-0 pointer-events-none bg-[radial-gradient(circle_at_20%_50%,rgba(255,255,255,0.1)_0%,transparent_50%),radial-gradient(circle_at_80%_80%,rgba(255,255,255,0.05)_0%,transparent_50%)]">
    </div>

    <div class="container relative z-10 mx-auto px-4">
        <div class="grid grid-cols-1 gap-4 md:grid-cols-2 lg:grid-cols-4 lg:gap-8">
            <div class="flex items-center gap-6 p-6 transition-all border border-white/20 rounded-lg shadow-sm bg-white/10 backdrop-blur-md hover:bg-white/15 hover:-translate-y-1 hover:shadow-2xl fade-in group"
                *ngFor="let stat of stats">
                <div
                    class="flex items-center justify-center w-16 h-16 text-white rounded-md shrink-0 bg-white/20 [&_svg]:w-9 [&_svg]:h-9 [&_svg]:stroke-current">
                    <div [innerHTML]="stat.icon"></div>
                </div>
                <div class="flex-1">
                    <h3 class="mb-1 text-3xl font-extrabold leading-none text-white md:text-4xl">{{ stat.number }}</h3>
                    <p class="m-0 text-sm font-medium text-white/90 md:text-base">{{ stat.label }}</p>
                </div>
            </div>
        </div>
    </div>
</section>
