<div class="flex h-screen bg-gray-100 font-sans">
    <!-- Sidebar -->
    <aside class="bg-slate-900 text-white transition-all duration-300 flex flex-col shadow-xl z-20"
        [ngClass]="{'w-20': isSidebarCollapsed, 'w-64': !isSidebarCollapsed}">

        <!-- Sidebar Header -->
        <div class="h-16 flex items-center justify-between px-4 bg-slate-950 border-b border-slate-800">
            <div class="flex items-center gap-3 overflow-hidden whitespace-nowrap" *ngIf="!isSidebarCollapsed">
                <div class="w-8 h-8 rounded bg-emerald-500 flex items-center justify-center text-white font-bold">
                    A
                </div>
                <span class="font-bold text-lg tracking-wide">Admin Panel</span>
            </div>
            <div class="w-8 h-8 rounded bg-emerald-500 flex items-center justify-center text-white font-bold mx-auto"
                *ngIf="isSidebarCollapsed">
                A
            </div>
            <button class="p-1.5 rounded-lg hover:bg-slate-800 text-slate-400 hover:text-white transition-colors"
                (click)="toggleSidebar()" *ngIf="!isSidebarCollapsed">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="m15 18-6-6 6-6" />
                </svg>
            </button>
        </div>

        <!-- Sidebar Navigation -->
        <nav class="flex-1 overflow-y-auto py-4 space-y-1">
            <a [routerLink]="['./']" routerLinkActive="bg-emerald-600 text-white shadow-lg shadow-emerald-900/20"
                [routerLinkActiveOptions]="{exact: true}"
                class="flex items-center gap-3 px-4 py-3 mx-2 rounded-lg text-slate-300 hover:bg-slate-800 hover:text-white transition-all group relative overflow-hidden">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                    class="flex-shrink-0">
                    <rect width="7" height="9" x="3" y="3" rx="1" />
                    <rect width="7" height="5" x="14" y="3" rx="1" />
                    <rect width="7" height="9" x="14" y="12" rx="1" />
                    <rect width="7" height="5" x="3" y="16" rx="1" />
                </svg>
                <span class="whitespace-nowrap font-medium" *ngIf="!isSidebarCollapsed">Dashboard</span>
                <!-- Tooltip for collapsed state -->
                <div *ngIf="isSidebarCollapsed"
                    class="absolute left-full top-1/2 -translate-y-1/2 ml-2 px-2 py-1 bg-slate-800 text-white text-xs rounded opacity-0 group-hover:opacity-100 pointer-events-none whitespace-nowrap z-50 shadow-lg">
                    Dashboard
                </div>
            </a>

            <a [routerLink]="['./donations']"
                routerLinkActive="bg-emerald-600 text-white shadow-lg shadow-emerald-900/20"
                class="flex items-center gap-3 px-4 py-3 mx-2 rounded-lg text-slate-300 hover:bg-slate-800 hover:text-white transition-all group relative">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                    class="flex-shrink-0">
                    <circle cx="12" cy="12" r="10" />
                    <path d="M16 8h-6a2 2 0 1 0 0 4h4a2 2 0 1 1 0 4H8" />
                    <path d="M12 18V6" />
                </svg>
                <span class="whitespace-nowrap font-medium" *ngIf="!isSidebarCollapsed">Donations</span>
                <div *ngIf="isSidebarCollapsed"
                    class="absolute left-full top-1/2 -translate-y-1/2 ml-2 px-2 py-1 bg-slate-800 text-white text-xs rounded opacity-0 group-hover:opacity-100 pointer-events-none whitespace-nowrap z-50 shadow-lg">
                    Donations
                </div>
            </a>

            <a [routerLink]="['./projects']"
                routerLinkActive="bg-emerald-600 text-white shadow-lg shadow-emerald-900/20"
                class="flex items-center gap-3 px-4 py-3 mx-2 rounded-lg text-slate-300 hover:bg-slate-800 hover:text-white transition-all group relative">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                    class="flex-shrink-0">
                    <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z" />
                    <path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z" />
                </svg>
                <span class="whitespace-nowrap font-medium" *ngIf="!isSidebarCollapsed">Projects</span>
                <div *ngIf="isSidebarCollapsed"
                    class="absolute left-full top-1/2 -translate-y-1/2 ml-2 px-2 py-1 bg-slate-800 text-white text-xs rounded opacity-0 group-hover:opacity-100 pointer-events-none whitespace-nowrap z-50 shadow-lg">
                    Projects
                </div>
            </a>

            <a [routerLink]="['./users']" routerLinkActive="bg-emerald-600 text-white shadow-lg shadow-emerald-900/20"
                class="flex items-center gap-3 px-4 py-3 mx-2 rounded-lg text-slate-300 hover:bg-slate-800 hover:text-white transition-all group relative">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                    class="flex-shrink-0">
                    <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2" />
                    <circle cx="9" cy="7" r="4" />
                    <path d="M22 21v-2a4 4 0 0 0-3-3.87" />
                    <path d="M16 3.13a4 4 0 0 1 0 7.75" />
                </svg>
                <span class="whitespace-nowrap font-medium" *ngIf="!isSidebarCollapsed">Users</span>
                <div *ngIf="isSidebarCollapsed"
                    class="absolute left-full top-1/2 -translate-y-1/2 ml-2 px-2 py-1 bg-slate-800 text-white text-xs rounded opacity-0 group-hover:opacity-100 pointer-events-none whitespace-nowrap z-50 shadow-lg">
                    Users
                </div>
            </a>

            <a [routerLink]="['./settings']"
                routerLinkActive="bg-emerald-600 text-white shadow-lg shadow-emerald-900/20"
                class="flex items-center gap-3 px-4 py-3 mx-2 rounded-lg text-slate-300 hover:bg-slate-800 hover:text-white transition-all group relative">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                    class="flex-shrink-0">
                    <path
                        d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.1a2 2 0 0 1-1-1.72v-.51a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z" />
                    <circle cx="12" cy="12" r="3" />
                </svg>
                <span class="whitespace-nowrap font-medium" *ngIf="!isSidebarCollapsed">Settings</span>
                <div *ngIf="isSidebarCollapsed"
                    class="absolute left-full top-1/2 -translate-y-1/2 ml-2 px-2 py-1 bg-slate-800 text-white text-xs rounded opacity-0 group-hover:opacity-100 pointer-events-none whitespace-nowrap z-50 shadow-lg">
                    Settings
                </div>
            </a>
        </nav>

        <!-- Sidebar Footer -->
        <div class="p-4 border-t border-slate-800">
            <button (click)="logout()"
                class="flex items-center gap-3 w-full px-4 py-3 rounded-lg text-slate-400 hover:bg-red-500/10 hover:text-red-500 transition-all group relative">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                    class="flex-shrink-0">
                    <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
                    <polyline points="16 17 21 12 16 7" />
                    <line x1="21" x2="9" y1="12" y2="12" />
                </svg>
                <span class="whitespace-nowrap font-medium" *ngIf="!isSidebarCollapsed">Logout</span>
                <div *ngIf="isSidebarCollapsed"
                    class="absolute left-full top-1/2 -translate-y-1/2 ml-2 px-2 py-1 bg-slate-800 text-white text-xs rounded opacity-0 group-hover:opacity-100 pointer-events-none whitespace-nowrap z-50 shadow-lg">
                    Logout
                </div>
            </button>

            <!-- Collapse Button (Bottom) for when expanded -->
            <button *ngIf="!isSidebarCollapsed" (click)="toggleSidebar()"
                class="mt-4 flex items-center justify-center w-full py-2 text-slate-500 hover:text-slate-300 transition-colors">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="m11 17-5-5 5-5" />
                    <path d="m18 17-5-5 5-5" />
                </svg>
            </button>
        </div>
    </aside>

    <!-- Main Content -->
    <main class="flex-1 flex flex-col overflow-hidden relative">
        <!-- Top Header -->
        <header class="h-16 bg-white shadow-sm flex items-center justify-between px-6 z-10">
            <div class="flex items-center gap-4">
                <button (click)="toggleSidebar()" *ngIf="isSidebarCollapsed"
                    class="p-2 rounded-lg hover:bg-gray-100 text-gray-600">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="3" x2="21" y1="6" y2="6" />
                        <line x1="3" x2="21" y1="12" y2="12" />
                        <line x1="3" x2="21" y1="18" y2="18" />
                    </svg>
                </button>
                <div>
                    <h1 class="text-xl font-bold text-gray-800">{{ currentPageTitle }}</h1>
                    <p class="text-sm text-gray-500 hidden md:block">{{ currentPageSubtitle }}</p>
                </div>
            </div>

            <div class="flex items-center gap-6">
                <!-- Notifications -->
                <button class="relative p-2 rounded-full hover:bg-gray-100 text-gray-500 transition-colors">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9" />
                        <path d="M10.3 21a1.94 1.94 0 0 0 3.4 0" />
                    </svg>
                    <span class="absolute top-1.5 right-1.5 w-2 h-2 bg-red-500 rounded-full border border-white"></span>
                </button>

                <!-- User Profile -->
                <div class="flex items-center gap-3 pl-6 border-l border-gray-200">
                    <div class="text-right hidden md:block">
                        <p class="text-sm font-semibold text-gray-800">{{ adminEmail }}</p>
                        <p class="text-xs text-emerald-600 font-medium">Administrator</p>
                    </div>
                    <div
                        class="w-10 h-10 rounded-full bg-emerald-100 flex items-center justify-center text-emerald-600 font-bold border-2 border-white shadow-sm">
                        {{ adminEmail.charAt(0).toUpperCase() }}
                    </div>
                </div>
            </div>
        </header>

        <!-- Scrollable Content Area -->
        <div class="flex-1 overflow-auto p-6 bg-gray-50">
            <div class="max-w-7xl mx-auto">
                <router-outlet></router-outlet>
            </div>
        </div>
    </main>
</div>
