<div class="space-y-6">
    <div class="bg-white rounded-xl shadow-sm p-6 border border-gray-100">
        <h2 class="text-2xl font-bold text-gray-800 mb-1">Settings</h2>
        <p class="text-gray-600">Configure system settings and preferences.</p>
    </div>

    <div class="bg-white rounded-xl shadow-sm border border-gray-100 divide-y divide-gray-100">
        <!-- General Settings -->
        <div class="p-6">
            <h3 class="text-lg font-medium text-gray-900 mb-4">General Settings</h3>
            <div class="space-y-4 max-w-2xl">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Site Name</label>
                    <input type="text" value="Charity Foundation"
                        class="block w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-emerald-500 focus:border-emerald-500 outline-none">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Contact Email</label>
                    <input type="email" value="info@charity.org"
                        class="block w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-emerald-500 focus:border-emerald-500 outline-none">
                </div>
            </div>
        </div>

        <!-- Security Settings -->
        <div class="p-6">
            <h3 class="text-lg font-medium text-gray-900 mb-4">Security</h3>
            <div class="flex items-center justify-between py-2">
                <div>
                    <p class="font-medium text-gray-800">Two-Factor Authentication</p>
                    <p class="text-sm text-gray-500">Add an extra layer of security to your account.</p>
                </div>
                <button
                    class="relative inline-flex h-6 w-11 flex-shrink-0 cursor-pointer rounded-full border-2 border-transparent transition-colors duration-200 ease-in-out focus:outline-none focus:ring-2 focus:ring-emerald-600 focus:ring-offset-2 bg-gray-200">
                    <span
                        class="translate-x-0 pointer-events-none inline-block h-5 w-5 transform rounded-full bg-white shadow ring-0 transition duration-200 ease-in-out"></span>
                </button>
            </div>
        </div>

        <!-- Save Button -->
        <div class="p-6 bg-gray-50 flex justify-end">
            <button
                class="px-6 py-2 bg-emerald-600 text-white rounded-lg hover:bg-emerald-700 transition-colors font-medium">
                Save Changes
            </button>
        </div>
    </div>
</div>
