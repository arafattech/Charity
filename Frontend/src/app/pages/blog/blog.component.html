<div class="blog-page">
    <!-- Page Header -->
    <section class="page-header">
        <div class="container">
            <h1 class="page-title fade-in">ব্লগ</h1>
            <p class="page-subtitle fade-in">ইসলামি জ্ঞান, জীবনযাপন ও সমসাময়িক বিষয়ে আমাদের লেখা</p>
        </div>
    </section>

    <!-- Blog Grid Section -->
    <section class="blog-section py-6">
        <div class="container">
            <div class="blog-grid">
                <article class="blog-card fade-up" *ngFor="let post of blogPosts; let i = index"
                    [style.animation-delay]="i * 100 + 'ms'">
                    <div class="card-image">
                        <img [src]="post.image" [alt]="post.title">
                        <span class="category-badge">{{ post.category }}</span>
                    </div>
                    <div class="card-content">
                        <div class="meta-info">
                            <span class="date">
                                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24"
                                    fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                    stroke-linejoin="round">
                                    <rect width="18" height="18" x="3" y="4" rx="2" ry="2" />
                                    <line x1="16" x2="16" y1="2" y2="6" />
                                    <line x1="8" x2="8" y1="2" y2="6" />
                                    <line x1="3" x2="21" y1="10" y2="10" />
                                </svg>
                                {{ post.date }}
                            </span>
                            <span class="author">
                                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24"
                                    fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                    stroke-linejoin="round">
                                    <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2" />
                                    <circle cx="12" cy="7" r="4" />
                                </svg>
                                {{ post.author }}
                            </span>
                        </div>
                        <h2 class="post-title">
                            <a [routerLink]="['/blog', post.id]">{{ post.title }}</a>
                        </h2>
                        <p class="post-excerpt">{{ post.excerpt }}</p>
                        <a [routerLink]="['/blog', post.id]" class="read-more">
                            আরও পড়ুন
                            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24"
                                fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                stroke-linejoin="round">
                                <path d="M5 12h14" />
                                <path d="m12 5 7 7-7 7" />
                            </svg>
                        </a>
                    </div>
                </article>
            </div>

            <!-- Pagination -->
            <div class="pagination">
                <button class="page-btn prev" [disabled]="currentPage === 1" (click)="onPageChange(currentPage - 1)">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="m15 18-6-6 6-6" />
                    </svg>
                </button>
                <button class="page-number active">1</button>
                <button class="page-number">2</button>
                <button class="page-number">3</button>
                <button class="page-btn next" [disabled]="currentPage === totalPages"
                    (click)="onPageChange(currentPage + 1)">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="m9 18 6-6-6-6" />
                    </svg>
                </button>
            </div>
        </div>
    </section>
</div>
