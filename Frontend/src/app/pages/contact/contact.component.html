<div class="min-h-screen bg-gray-50">
    <!-- Page Header -->
    <section class="relative bg-gradient-to-r from-emerald-600 via-teal-600 to-cyan-600 text-white py-20">
        <div class="absolute inset-0 bg-black/10"></div>
        <div class="container mx-auto px-4 relative z-10">
            <h1 class="text-4xl md:text-5xl font-bold text-center mb-4 animate-fade-in">যোগাযোগ</h1>
            <p class="text-xl text-center text-white/90 animate-fade-in">যেকোনো প্রয়োজনে আমাদের সাথে যোগাযোগ করুন</p>
        </div>
    </section>

    <div class="container mx-auto px-4 py-16">
        <div class="grid lg:grid-cols-2 gap-12">
            <!-- Contact Form -->
            <div class="bg-white rounded-xl shadow-lg p-8 animate-fade-up">
                <h2 class="text-2xl font-bold text-gray-800 mb-6 border-b pb-4">বার্তা পাঠান</h2>
                <form (submit)="onSubmit($event)" class="space-y-6">
                    <div>
                        <label for="name" class="block text-sm font-medium text-gray-700 mb-2">আপনার নাম</label>
                        <input type="text" id="name" placeholder="আপনার নাম লিখুন"
                            class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 transition-all outline-none">
                    </div>
                    <div>
                        <label for="email" class="block text-sm font-medium text-gray-700 mb-2">আপনার ইমেইল</label>
                        <input type="email" id="email" placeholder="আপনার ইমেইল লিখুন"
                            class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 transition-all outline-none">
                    </div>
                    <div>
                        <label for="subject" class="block text-sm font-medium text-gray-700 mb-2">বিষয়</label>
                        <input type="text" id="subject" placeholder="বিষয় লিখুন"
                            class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 transition-all outline-none">
                    </div>
                    <div>
                        <label for="message" class="block text-sm font-medium text-gray-700 mb-2">আপনার বার্তা</label>
                        <textarea id="message" rows="5" placeholder="আপনার বার্তা লিখুন"
                            class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 transition-all outline-none resize-none"></textarea>
                    </div>
                    <button type="submit"
                        class="w-full bg-gradient-to-r from-emerald-600 to-teal-600 text-white font-bold py-4 rounded-lg hover:shadow-lg hover:-translate-y-0.5 transition-all duration-300">বার্তা
                        পাঠান</button>
                </form>
            </div>

            <!-- Contact Info & Map -->
            <div class="space-y-8 animate-fade-up" style="animation-delay: 100ms;">
                <div class="grid gap-6">
                    <div class="bg-white rounded-xl shadow-md p-6 flex items-start gap-4 hover:shadow-lg transition-shadow duration-300"
                        *ngFor="let info of contactInfo">
                        <div class="w-12 h-12 bg-emerald-100 rounded-lg flex items-center justify-center text-emerald-600 flex-shrink-0"
                            [innerHTML]="info.icon"></div>
                        <div>
                            <h3 class="text-lg font-bold text-gray-800 mb-1">{{ info.title }}</h3>
                            <p class="text-gray-600">{{ info.details }}</p>
                        </div>
                    </div>
                </div>

                <div class="bg-white rounded-xl shadow-lg overflow-hidden h-[400px]">
                    <iframe
                        src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3651.0556740683453!2d90.42194547605928!3d23.76602498759547!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x3755c78f1d0f4b7f%3A0x8633433230565197!2sAs-Sunnah%20Foundation!5e0!3m2!1sen!2sbd!4v1709723456789!5m2!1sen!2sbd"
                        width="100%" height="100%" style="border:0;" allowfullscreen="" loading="lazy"
                        referrerpolicy="no-referrer-when-downgrade">
                    </iframe>
                </div>
            </div>
        </div>
    </div>
</div>
