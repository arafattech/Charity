<div class="contact-page">
    <!-- Page Header -->
    <section class="page-header">
        <div class="container">
            <h1 class="page-title fade-in">যোগাযোগ</h1>
            <p class="page-subtitle fade-in">যেকোনো প্রয়োজনে আমাদের সাথে যোগাযোগ করুন</p>
        </div>
    </section>

    <div class="container py-6">
        <div class="contact-grid">
            <!-- Contact Form -->
            <div class="contact-form-wrapper fade-up">
                <h2>বার্তা পাঠান</h2>
                <form (submit)="onSubmit($event)" class="contact-form">
                    <div class="form-group">
                        <label for="name">আপনার নাম</label>
                        <input type="text" id="name" placeholder="আপনার নাম লিখুন" class="form-control">
                    </div>
                    <div class="form-group">
                        <label for="email">আপনার ইমেইল</label>
                        <input type="email" id="email" placeholder="আপনার ইমেইল লিখুন" class="form-control">
                    </div>
                    <div class="form-group">
                        <label for="subject">বিষয়</label>
                        <input type="text" id="subject" placeholder="বিষয় লিখুন" class="form-control">
                    </div>
                    <div class="form-group">
                        <label for="message">আপনার বার্তা</label>
                        <textarea id="message" rows="5" placeholder="আপনার বার্তা লিখুন"
                            class="form-control"></textarea>
                    </div>
                    <button type="submit" class="btn btn-primary btn-block">বার্তা পাঠান</button>
                </form>
            </div>

            <!-- Contact Info & Map -->
            <div class="contact-info-wrapper fade-up delay-100">
                <div class="info-cards">
                    <div class="info-card" *ngFor="let info of contactInfo">
                        <div class="icon-wrapper" [innerHTML]="info.icon"></div>
                        <div class="info-content">
                            <h3>{{ info.title }}</h3>
                            <p>{{ info.details }}</p>
                        </div>
                    </div>
                </div>

                <div class="map-container">
                    <iframe
                        src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3651.0556740683453!2d90.42194547605928!3d23.76602498759547!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x3755c78f1d0f4b7f%3A0x8633433230565197!2sAs-Sunnah%20Foundation!5e0!3m2!1sen!2sbd!4v1709723456789!5m2!1sen!2sbd"
                        width="100%" height="100%" style="border:0;" allowfullscreen="" loading="lazy"
                        referrerpolicy="no-referrer-when-downgrade">
                    </iframe>
                </div>
            </div>
        </div>
    </div>
</div>
