<div class="login-page">
    <div class="login-card">
        <div class="logo">
            <!-- Using text logo for now if image not available, or placeholder -->
            <h2 style="color: var(--primary-green); margin: 0;">আস-সুন্নাহ ফাউন্ডেশন</h2>
        </div>

        <h2>Sign In</h2>

        <form>
            <div class="form-group">
                <label for="email">Phone / Email</label>
                <input type="text" id="email" placeholder="Enter phone or email">
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="Enter password">
            </div>

            <div class="form-actions">
                <label class="remember-me">
                    <input type="checkbox"> Remember me
                </label>
                <a href="#" class="forgot-password">Forgot Password?</a>
            </div>

            <button type="submit" class="btn-submit">Sign In</button>
        </form>

        <div class="divider">
            <span>Or sign in with</span>
        </div>

        <div class="social-login">
            <button class="social-btn google" title="Sign in with Google">
                <i class="fab fa-google"></i>
            </button>
            <button class="social-btn facebook" title="Sign in with Facebook">
                <i class="fab fa-facebook-f"></i>
            </button>
        </div>

        <div class="signup-link">
            Don't have an account? <a href="#">Sign Up</a>
        </div>
    </div>
</div>
